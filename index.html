                { category: "surface", chinese: "流", pinyin: "liú", english: "flow / current", definitionCn: "动力流动", definitionEn: "dynamic movement", dissect: [{ cn: "流", en: "flow" }] },
                { category: "surface", chinese: "漩", pinyin: "xuán", english: "whirlpool", definitionCn: "动态旋转水流", definitionEn: "circular flow", dissect: [{ cn: "漩", en: "whirl" }] },
                { category: "surface", chinese: "潮", pinyin: "cháo", english: "tide", definitionCn: "周期性涨落", definitionEn: "periodic rise and fall", dissect: [{ cn: "潮", en: "tide" }] },
                { category: "land-area", chinese: "大洲", pinyin: "dà zhōu", english: "continent", definitionCn: "大片连续陆地", definitionEn: "large continuous landmass", dissect: [{ cn: "洲", en: "continent" }] },
                { category: "land-area", chinese: "平原", pinyin: "píng yuán", english: "plain", definitionCn: "地势平坦、起伏小", definitionEn: "flat, low-relief land", dissect: [{ cn: "平", en: "flat" }, { cn: "原", en: "plain" }] },
                { category: "land-area", chinese: "平地", pinyin: "píng dì", english: "flatland", definitionCn: "泛指平坦地面", definitionEn: "general term for level ground", dissect: [{ cn: "平", en: "flat" }, { cn: "地", en: "land" }] },
                { category: "land-area", chinese: "高原", pinyin: "gāo yuán", english: "plateau", definitionCn: "海拔高但地形平坦", definitionEn: "elevated flat land", dissect: [{ cn: "高", en: "high" }, { cn: "原", en: "plain" }] },
                { category: "land-area", chinese: "台地", pinyin: "tái dì", english: "tableland", definitionCn: "边陡顶平的高地", definitionEn: "flat-topped elevated land", dissect: [{ cn: "台", en: "platform" }, { cn: "地", en: "land" }] },
                { category: "land-area", chinese: "盆地", pinyin: "pén dì", english: "basin", definitionCn: "四周高、中间低", definitionEn: "low area surrounded by higher land", dissect: [{ cn: "盆", en: "basin" }, { cn: "地", en: "land" }] },
                { category: "land-area", chinese: "低地", pinyin: "dī dì", english: "lowland", definitionCn: "地势低平的地带", definitionEn: "area of land lower than surroundings", dissect: [{ cn: "低", en: "low" }, { cn: "地", en: "land" }] },
                { category: "land-area", chinese: "沙漠", pinyin: "shā mò", english: "desert", definitionCn: "荒凉的沙质之地", definitionEn: "arid sandy land", dissect: [{ cn: "沙", en: "sand" }, { cn: "漠", en: "desert" }] },
                { category: "land-area", chinese: "冻原", pinyin: "dòng yuán", english: "tundra", definitionCn: "冻结的平原，有永久冻土", definitionEn: "frozen plain with permafrost", dissect: [{ cn: "冻", en: "frozen" }, { cn: "原", en: "plain" }] },
                { category: "land-area", chinese: "雨林", pinyin: "yǔ lín", english: "rainforest", definitionCn: "降水丰沛的密林", definitionEn: "dense forest with heavy rainfall", dissect: [{ cn: "雨", en: "rain" }, { cn: "林", en: "forest" }] },
                { category: "land-hill", chinese: "山地", pinyin: "shān dì", english: "mountains", definitionCn: "高大复杂地形", definitionEn: "high-elevation rugged land", dissect: [{ cn: "山", en: "mountain" }, { cn: "地", en: "land" }] },
                { category: "land-hill", chinese: "山口", pinyin: "shān kǒu", english: "mountain pass", definitionCn: "山岭间的交通孔道", definitionEn: "navigable route through a range", dissect: [{ cn: "山", en: "mountain" }, { cn: "口", en: "opening" }] },
                { category: "land-hill", chinese: "山脊", pinyin: "shān jǐ", english: "ridge", definitionCn: "背脊状隆起线", definitionEn: "long narrow crest", dissect: [{ cn: "山", en: "mountain" }, { cn: "脊", en: "ridge" }] },
                { category: "land-hill", chinese: "山坡", pinyin: "shān pō", english: "slope", definitionCn: "山体倾斜面", definitionEn: "inclined surface of a mountain", dissect: [{ cn: "山", en: "mountain" }, { cn: "坡", en: "slope" }] },
                { category: "land-hill", chinese: "丘陵", pinyin: "qiū líng", english: "hills", definitionCn: "低矮连绵起伏", definitionEn: "gently rolling hills", dissect: [{ cn: "丘", en: "hill" }, { cn: "陵", en: "mound" }] },
                { category: "land-hill", chinese: "孤丘", pinyin: "gū qiū", english: "butte", definitionCn: "孤立的平顶丘", definitionEn: "isolated flat-topped hill", dissect: [{ cn: "孤", en: "isolated" }, { cn: "丘", en: "hill" }] },
                { category: "land-erosion", chinese: "谷地", pinyin: "gǔ dì", english: "valley", definitionCn: "山间长形低洼地", definitionEn: "elongated depression between hills", dissect: [{ cn: "谷", en: "valley" }, { cn: "地", en: "land" }] },
                { category: "land-erosion", chinese: "河谷", pinyin: "hé gǔ", english: "river valley", definitionCn: "河流流经的谷地", definitionEn: "valley formed by flowing water", dissect: [{ cn: "河", en: "river" }, { cn: "谷", en: "valley" }] },
                { category: "land-erosion", chinese: "峡谷", pinyin: "xiá gǔ", english: "canyon", definitionCn: "狭长陡峭谷地", definitionEn: "deep, narrow and steep valley", dissect: [{ cn: "峡", en: "gorge" }, { cn: "谷", en: "valley" }] },
                { category: "land-erosion", chinese: "冲沟", pinyin: "chōng gōu", english: "gully", definitionCn: "流水侵蚀形成的沟壑", definitionEn: "trench worn by running water", dissect: [{ cn: "冲", en: "erode" }, { cn: "沟", en: "ditch" }] },
                { category: "land-erosion", chinese: "峡湾", pinyin: "xiá wān", english: "fjord", definitionCn: "狭长的海湾", definitionEn: "narrow and long sea inlet/bay", dissect: [{ cn: "峡", en: "gorge" }, { cn: "湾", en: "bay" }] },
                { category: "land-erosion", chinese: "悬崖", pinyin: "xuán yá", english: "cliff", definitionCn: "垂直/悬空陡壁", definitionEn: "steep rock face or overhanging wall", dissect: [{ cn: "悬", en: "hanging" }, { cn: "崖", en: "cliff" }] },
                { category: "land-erosion", chinese: "溶洞", pinyin: "róng dòng", english: "karst cave", definitionCn: "化学溶蚀形成的洞穴", definitionEn: "cave formed by chemical dissolution", dissect: [{ cn: "溶", en: "dissolve" }, { cn: "洞", en: "cave" }] },
                { category: "land-erosion", chinese: "石林", pinyin: "shí lín", english: "stone forest", definitionCn: "岩石密集如林", definitionEn: "forest-like dense rock formations", dissect: [{ cn: "石", en: "stone" }, { cn: "林", en: "forest" }] },
                { category: "land-erosion", chinese: "沙丘", pinyin: "shā qiū", english: "sand dune", definitionCn: "风力堆积的沙丘", definitionEn: "wind-formed sand hill", dissect: [{ cn: "沙", en: "sand" }, { cn: "丘", en: "hill" }] },
                { category: "land-special", chinese: "火山", pinyin: "huǒ shān", english: "volcano", definitionCn: "炽热岩浆喷发的山体", definitionEn: "mountain erupting fire and magma", dissect: [{ cn: "火", en: "fire" }, { cn: "山", en: "mountain" }] },
                { category: "land-special", chinese: "冰川", pinyin: "bīng chuān", english: "glacier", definitionCn: "流动的冰体", definitionEn: "moving mass of ice", dissect: [{ cn: "冰", en: "ice" }, { cn: "川", en: "river" }] },
                { category: "land-special", chinese: "冰川谷", pinyin: "bīng chuān gǔ", english: "glacial valley", definitionCn: "冰川侵蚀形成的谷地", definitionEn: "valley formed by glacial erosion", dissect: [{ cn: "冰川", en: "glacier" }, { cn: "谷", en: "valley" }] },
                { category: "land-special", chinese: "隧道", pinyin: "suì dào", english: "tunnel", definitionCn: "地下或山中通路", definitionEn: "subterranean passage", dissect: [{ cn: "隧", en: "tunnel" }, { cn: "道", en: "path" }] },
                { category: "land-special", chinese: "海岸", pinyin: "hǎi àn", english: "coast", definitionCn: "海洋的边缘", definitionEn: "edge of the sea", dissect: [{ cn: "海", en: "sea" }, { cn: "岸", en: "shore" }] },
                { category: "land-special", chinese: "泉", pinyin: "quán", english: "spring", definitionCn: "地下水出露", definitionEn: "ground water emerging", dissect: [{ cn: "泉", en: "spring" }] },
                { category: "land-special", chinese: "沟", pinyin: "gōu", english: "ditch / channel", definitionCn: "人工排水为主", definitionEn: "primarily man-made drainage", dissect: [{ cn: "沟", en: "ditch" }] }
            ];

            const categoryLabels = {
                "all": "🌐 全部地形与水 All Land & Water",
                "small-still": "💧 静水 Small Still Water",
                "lakes": "🏞️ 湖泊 Lakes & Inland Water",
                "wetlands": "🌿 湿地 Wetlands & Low Water",
                "mountain": "🏔️ 山涧溪流 Mountain Water",
                "rivers": "🌊 河流 Rivers & Flowing Water",
                "fast-deep": "⚡ 急流深渊 Fast / Deep Water",
                "sea-coastal": "🌊 海洋海岸 Sea & Coastal Water",
                "land-water": "🏝️ 水中陆地 Land in / by Water",
                "surface": "🌬️ 水面动态 Surface Water Motion",
                "land-area": "🗺️ 面状区域 Land Areas & Regions",
                "land-hill": "⛰️ 丘状山地 Hills & Mountains",
                "land-erosion": "🏜️ 侵蚀切割 Erosion & Caves",
                "land-special": "🌋 特殊构造 Special Formations"
            };

            // ========================================
            // IMAGE PATHS - EDIT THESE TO MATCH YOUR FILES
            // ========================================
            const categoryImages = {
                "all": "images/all-land-water.png",
                "small-still": "images/small-still-water.png",
                "lakes": "images/lakes.png",
                "wetlands": "images/wetlands.png",
                "mountain": "images/mountain-water.png",
                "rivers": "images/rivers.png",
                "fast-deep": "images/fast-deep-water.png",
                "sea-coastal": "images/sea-coastal.png",
                "land-water": "images/land-in-water.png",
                "surface": "images/surface-motion.png",
                "land-area": "images/land-areas.png",
                "land-hill": "images/hills-mountains.png",
                "land-erosion": "images/erosion-caves.png",
                "land-special": "images/special-formations.png"
            };

            let currentCategory = "all";
            const tableContainer = document.getElementById('dynamicTableContainer');
            const puzzleGallery = document.getElementById('puzzleGallery');
            const imageSlot = document.getElementById('categoryImageSlot');

            function updateCategoryImage(cat) {
                const imagePath = categoryImages[cat];
                const label = categoryLabels[cat] || cat;
                
                if (imagePath) {
                    imageSlot.innerHTML = `
                        <img src="${imagePath}" 
                             alt="${label}" 
                             style="max-width:100%; max-height:400px; border-radius:1.5rem; object-fit:contain;"
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div class='image-placeholder'>🖼️ ${label} — 图片未找到 (Image not found)<br><small>请将图片放在: ${imagePath}</small></div>';">
                    `;
                } else {
                    imageSlot.innerHTML = `
                        <div class="image-placeholder">
                            🖼️ ${label} — 图片位置 (PNG)
                        </div>
                    `;
                }
            }

            function buildDissection(dissect, fullChinese) {
                if (!dissect || dissect.length === 0) return '';
                let cnLine = '<div class="dissect-line">🧩 中文：';
                dissect.forEach((p, i) => {
                    if (i > 0) cnLine += '<span class="plus-sign"> + </span>';
                    cnLine += `<span class="char-piece">${p.cn} <small>(${cnMeaningMap[p.cn] || p.cn})</small></span>`;
                });
                cnLine += `<span class="arrow-sign"> = </span><span class="result-word">${fullChinese}</span></div>`;
                let enLine = '<div class="dissect-line en-line">🔤 English: ';
                dissect.forEach((p, i) => {
                    if (i > 0) enLine += ' + ';
                    enLine += `<strong>${p.cn}</strong> (${p.en})`;
                });
                enLine += ` = <strong>${fullChinese}</strong></div>`;
                return `<div class="puzzle-box">${cnLine}${enLine}</div>`;
            }

            function renderTable(cat) {
                const filtered = cat === 'all' ? fullDataset : fullDataset.filter(d => d.category === cat);
                if (!filtered.length) {
                    tableContainer.innerHTML = '<p style="padding:2rem;text-align:center;">✨ 此分类暂无数据 / No items in this category yet.</p>';
                    return;
                }
                let html = `<div class="table-wrapper"><table><thead><tr><th>中文 & Pinyin</th><th>English</th><th>定义 / Definition</th></tr></thead><tbody>`;
                filtered.forEach(item => {
                    html += `<tr>
                        <td class="chinese-cell">${item.chinese}<span class="pinyin-sm">${item.pinyin}</span></td>
                        <td class="english-name">${item.english}</td>
                        <td><span style="font-weight:600;">${item.definitionCn}</span><br><span style="color:#3a5a6b;">${item.definitionEn}</span></td>
                    </tr>`;
                    if (item.dissect && item.dissect.length > 0) {
                        html += `<tr style="background:#fffdf7;"><td colspan="3">${buildDissection(item.dissect, item.chinese)}</td></tr>`;
                    }
                });
                html += '</tbody></table></div>';
                tableContainer.innerHTML = html;
            }

            function renderGallery() {
                const examples = fullDataset.filter(d => d.dissect && d.dissect.length >= 2).slice(0, 10);
                let h = '';
                examples.forEach(item => {
                    h += `<div style="background:#f4f9fc;padding:0.8rem 1.2rem;border-radius:1.5rem;margin-bottom:0.5rem;">${buildDissection(item.dissect, item.chinese)}</div>`;
                });
                puzzleGallery.innerHTML = h || '<p>🔍 拆解更多词汇可见上方表格。</p>';
            }

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    const cat = e.currentTarget.dataset.category;
                    currentCategory = cat;
                    updateCategoryImage(cat);
                    renderTable(cat);
                });
            });

            // Initial render
            updateCategoryImage('all');
            renderTable('all');
            renderGallery();
        })();
    </script>
</body>
